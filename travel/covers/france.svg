<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Eiffel Tower, Paris" class="country-cover-svg">
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f1812" stroke-width="0.6" opacity="0.18"/>
  </pattern>
</defs>
<g fill="none" stroke="#b4513a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

  <line x1="0" y1="285" x2="800" y2="285" opacity="0.4"/>
  <!-- Clouds -->
  <path d="M 540 90 Q 580 78 620 90 Q 660 78 690 90 Q 680 100 620 100 Q 560 100 540 90 Z" stroke-width="1.3" opacity="0.45"/>
  <!-- Moon -->
  <circle cx="170" cy="100" r="28" stroke="#b4513a" stroke-width="1.6" opacity="0.7"/>
  <circle cx="178" cy="98" r="28" fill="#1f1812" stroke="none" opacity="0.18"/>
  <!-- Eiffel Tower -->
  <g transform="translate(400 285)">
    <!-- Four legs converging -->
    <path d="M -60 0 Q -55 -40 -34 -75" stroke-width="2.4" fill="none"/>
    <path d="M 60 0 Q 55 -40 34 -75" stroke-width="2.4" fill="none"/>
    <path d="M -45 0 Q -42 -38 -28 -75" stroke-width="1.6" fill="none" opacity="0.8"/>
    <path d="M 45 0 Q 42 -38 28 -75" stroke-width="1.6" fill="none" opacity="0.8"/>
    <!-- First platform -->
    <line x1="-40" y1="-75" x2="40" y2="-75" stroke-width="2.4"/>
    <line x1="-38" y1="-80" x2="38" y2="-80" stroke-width="1.5"/>
    <!-- Middle section -->
    <path d="M -34 -75 L -20 -135 L 20 -135 L 34 -75" stroke-width="2.2" fill="none"/>
    <!-- Second platform -->
    <line x1="-25" y1="-135" x2="25" y2="-135" stroke-width="2.2"/>
    <line x1="-23" y1="-140" x2="23" y2="-140" stroke-width="1.4"/>
    <!-- Upper section -->
    <path d="M -20 -135 L -12 -190 L 12 -190 L 20 -135" stroke-width="2" fill="none"/>
    <!-- Top -->
    <line x1="-12" y1="-190" x2="12" y2="-190" stroke-width="1.8"/>
    <path d="M -10 -190 L -3 -225 L 3 -225 L 10 -190" stroke-width="1.8" fill="none"/>
    <line x1="0" y1="-225" x2="0" y2="-245" stroke-width="1.8"/>
    <!-- Cross hatching detail -->
    <line x1="-50" y1="-30" x2="-25" y2="-50" stroke-width="0.8" opacity="0.6"/>
    <line x1="-25" y1="-30" x2="-50" y2="-50" stroke-width="0.8" opacity="0.6"/>
    <line x1="50" y1="-30" x2="25" y2="-50" stroke-width="0.8" opacity="0.6"/>
    <line x1="25" y1="-30" x2="50" y2="-50" stroke-width="0.8" opacity="0.6"/>
    <line x1="-28" y1="-90" x2="-15" y2="-115" stroke-width="0.8" opacity="0.6"/>
    <line x1="-15" y1="-90" x2="-28" y2="-115" stroke-width="0.8" opacity="0.6"/>
    <line x1="28" y1="-90" x2="15" y2="-115" stroke-width="0.8" opacity="0.6"/>
    <line x1="15" y1="-90" x2="28" y2="-115" stroke-width="0.8" opacity="0.6"/>
  </g>
  <!-- Seine — wavy lines -->
  <path d="M 0 305 Q 100 300 200 305 T 400 305 T 600 305 T 800 305" stroke-width="1.5" opacity="0.6"/>
  <path d="M 0 322 Q 120 318 240 322 T 480 322 T 720 322 T 800 322" stroke-width="1.4" opacity="0.45"/>
  <path d="M 0 338 Q 100 334 200 338 T 400 338 T 600 338 T 800 338" stroke-width="1.3" opacity="0.3"/>
  <!-- Birds -->
  <path d="M 240 130 Q 246 124 252 130 Q 258 124 264 130" stroke-width="1.4"/>
  <path d="M 590 160 Q 596 154 602 160 Q 608 154 614 160" stroke-width="1.3" opacity="0.7"/>
  <!-- Haussmann buildings (silhouette) -->
  <path d="M 70 285 L 70 220 L 130 220 L 130 285 Z" stroke-width="1.4" opacity="0.6"/>
  <line x1="80" y1="240" x2="120" y2="240" stroke-width="0.8" opacity="0.6"/>
  <line x1="80" y1="260" x2="120" y2="260" stroke-width="0.8" opacity="0.6"/>
  <path d="M 660 285 L 660 215 L 730 215 L 730 285 Z" stroke-width="1.4" opacity="0.6"/>
  <line x1="670" y1="235" x2="720" y2="235" stroke-width="0.8" opacity="0.6"/>
  <line x1="670" y1="255" x2="720" y2="255" stroke-width="0.8" opacity="0.6"/>

</g>
</svg>