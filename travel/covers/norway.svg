<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Norwegian fjord" class="country-cover-svg">
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f1812" stroke-width="0.6" opacity="0.18"/>
  </pattern>
</defs>
<g fill="none" stroke="#b4513a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Aurora wavy lines -->
  <path d="M 60 70 Q 200 40 380 75 Q 540 105 720 60" stroke="#2d5566" stroke-width="2.2" opacity="0.5"/>
  <path d="M 80 95 Q 240 65 420 100 Q 580 130 740 90" stroke="#2d5566" stroke-width="1.8" opacity="0.4"/>
  <path d="M 100 120 Q 280 95 460 125 Q 620 150 760 120" stroke="#2d5566" stroke-width="1.5" opacity="0.3"/>
  <!-- Stars -->
  <circle cx="180" cy="60" r="1.5" fill="#1f1812"/>
  <circle cx="320" cy="40" r="1.2" fill="#1f1812"/>
  <circle cx="490" cy="50" r="1.5" fill="#1f1812"/>
  <circle cx="620" cy="35" r="1.2" fill="#1f1812"/>
  <circle cx="710" cy="80" r="1.4" fill="#1f1812"/>
  <!-- Left cliff -->
  <path d="M 0 350 L 0 200 L 80 140 L 130 170 L 200 130 L 280 200 L 340 280 L 0 280 Z" fill="url(#hatch)" stroke="#1f1812" stroke-width="1.6"/>
  <path d="M 0 200 L 80 140 L 130 170 L 200 130 L 280 200 L 340 280" stroke-width="2.4" fill="none" stroke="#b4513a"/>
  <!-- Snow caps on left -->
  <path d="M 60 152 L 75 142 L 90 150" stroke="#1f1812" stroke-width="1.4" fill="none"/>
  <path d="M 180 138 L 200 130 L 220 142" stroke="#1f1812" stroke-width="1.4" fill="none"/>
  <!-- Right cliff -->
  <path d="M 800 350 L 800 180 L 740 130 L 680 160 L 600 110 L 540 160 L 470 220 L 800 280 Z" fill="url(#hatch)" stroke="#1f1812" stroke-width="1.6"/>
  <path d="M 800 180 L 740 130 L 680 160 L 600 110 L 540 160 L 470 220" stroke-width="2.4" fill="none" stroke="#b4513a"/>
  <!-- Snow on right -->
  <path d="M 720 142 L 740 130 L 760 144" stroke="#1f1812" stroke-width="1.4" fill="none"/>
  <path d="M 580 120 L 600 110 L 620 124" stroke="#1f1812" stroke-width="1.4" fill="none"/>
  <!-- Fjord water (between cliffs) -->
  <path d="M 280 280 Q 380 285 470 280 Q 470 290 380 295 Q 280 295 280 280 Z" fill="#2d5566" opacity="0.18"/>
  <path d="M 280 300 Q 350 296 420 300 Q 490 304 530 300" stroke="#2d5566" stroke-width="1.4" opacity="0.6"/>
  <path d="M 290 315 Q 360 311 430 315 Q 500 319 540 315" stroke="#2d5566" stroke-width="1.3" opacity="0.45"/>
  <!-- Small Viking ship -->
  <g transform="translate(370 270)">
    <path d="M 0 0 L 4 -3 L 56 -3 L 60 0 L 50 8 L 10 8 Z" fill="#1f1812" stroke="#1f1812" stroke-width="1.4"/>
    <!-- Mast -->
    <line x1="30" y1="-3" x2="30" y2="-26" stroke="#1f1812" stroke-width="1.4"/>
    <!-- Sail -->
    <path d="M 30 -25 L 14 -10 L 46 -10 Z" fill="#b4513a" stroke="#1f1812" stroke-width="1.2"/>
    <!-- Dragon prow -->
    <path d="M 56 -3 Q 62 -10 60 -16" stroke="#1f1812" stroke-width="1.6" fill="none"/>
  </g>

</g>
</svg>