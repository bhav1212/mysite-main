<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Taj Mahal, India" class="country-cover-svg">
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f1812" stroke-width="0.6" opacity="0.18"/>
  </pattern>
</defs>
<g fill="none" stroke="#b4513a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Horizon -->
  <line x1="0" y1="270" x2="800" y2="270" opacity="0.4"/>
  <!-- Distant Himalayas (right) -->
  <path d="M 530 270 L 580 220 L 620 240 L 660 200 L 700 230 L 740 215 L 800 245 L 800 270 Z" fill="url(#hatch)" stroke="#1f1812" stroke-width="1" opacity="0.7"/>
  <!-- Sun -->
  <circle cx="400" cy="170" r="42" fill="#b4513a" stroke="none" opacity="0.18"/>
  <circle cx="400" cy="170" r="42" stroke="#b4513a" stroke-width="1.5"/>
  <!-- Taj Mahal — central dome + 4 minarets + base -->
  <!-- Base platform -->
  <line x1="270" y1="270" x2="530" y2="270" stroke-width="3"/>
  <rect x="270" y="245" width="260" height="25" stroke-width="2.2"/>
  <!-- Main building block -->
  <rect x="320" y="195" width="160" height="50" stroke-width="2.2"/>
  <!-- Side arches -->
  <path d="M 340 245 L 340 215 Q 355 200 370 215 L 370 245"/>
  <path d="M 430 245 L 430 215 Q 445 200 460 215 L 460 245"/>
  <!-- Central arch (entrance) -->
  <path d="M 385 245 L 385 210 Q 400 188 415 210 L 415 245"/>
  <!-- Dome — onion shape -->
  <path d="M 350 195 Q 350 140 400 110 Q 450 140 450 195 Z" stroke-width="2.4"/>
  <!-- Dome finial -->
  <line x1="400" y1="110" x2="400" y2="85" stroke-width="2"/>
  <circle cx="400" cy="83" r="3" fill="#b4513a"/>
  <!-- Side small domes -->
  <path d="M 312 230 Q 312 215 325 207 Q 338 215 338 230"/>
  <path d="M 462 230 Q 462 215 475 207 Q 488 215 488 230"/>
  <!-- Minarets — 4 thin towers -->
  <line x1="285" y1="245" x2="285" y2="160" stroke-width="2"/>
  <circle cx="285" cy="158" r="4" fill="#b4513a"/>
  <line x1="285" y1="200" x2="285" y2="180"/>
  <line x1="515" y1="245" x2="515" y2="160" stroke-width="2"/>
  <circle cx="515" cy="158" r="4" fill="#b4513a"/>
  <line x1="515" y1="200" x2="515" y2="180"/>
  <line x1="255" y1="245" x2="255" y2="175" stroke-width="2"/>
  <circle cx="255" cy="173" r="3.5" fill="#b4513a"/>
  <line x1="545" y1="245" x2="545" y2="175" stroke-width="2"/>
  <circle cx="545" cy="173" r="3.5" fill="#b4513a"/>
  <!-- Reflection pool — wavy lines -->
  <path d="M 290 295 Q 320 290 350 295 T 410 295 T 470 295 T 510 295" stroke-width="1.5" opacity="0.6"/>
  <path d="M 280 310 Q 320 305 360 310 T 440 310 T 520 310" stroke-width="1.5" opacity="0.45"/>
  <!-- Bird far away -->
  <path d="M 130 110 Q 138 104 144 110 Q 150 104 158 110" stroke-width="1.5"/>
  <path d="M 90 140 Q 96 135 101 140 Q 106 135 112 140" stroke-width="1.4" opacity="0.7"/>

</g>
</svg>