<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dutch windmill" class="country-cover-svg">
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f1812" stroke-width="0.6" opacity="0.18"/>
  </pattern>
</defs>
<g fill="none" stroke="#b4513a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

  <line x1="0" y1="285" x2="800" y2="285" opacity="0.4"/>
  <!-- Clouds -->
  <path d="M 80 80 Q 110 65 145 80 Q 180 65 210 80 Q 200 95 150 95 Q 100 95 80 80 Z" stroke-width="1.4" opacity="0.55"/>
  <path d="M 500 110 Q 530 100 555 110 Q 580 100 605 110 Q 595 122 555 122 Q 515 122 500 110 Z" stroke-width="1.3" opacity="0.45"/>
  <!-- Sun (subtle) -->
  <circle cx="700" cy="100" r="28" stroke="#b4513a" stroke-width="1.5" opacity="0.6"/>
  <!-- Windmill on left -->
  <!-- Base building -->
  <path d="M 100 285 L 120 285 L 130 220 L 170 220 L 180 285 L 200 285 Z" fill="url(#hatch)" stroke="#1f1812" stroke-width="1.5"/>
  <!-- Windmill cap -->
  <path d="M 130 220 Q 150 195 170 220" fill="#b4513a" opacity="0.18" stroke="#b4513a" stroke-width="2.2"/>
  <!-- Sail axis -->
  <circle cx="150" cy="208" r="4" fill="#1f1812"/>
  <!-- 4 sails -->
  <g transform="translate(150 208) rotate(35)">
    <line x1="0" y1="0" x2="0" y2="-78" stroke-width="2.2"/>
    <line x1="0" y1="0" x2="0" y2="78" stroke-width="2.2"/>
    <line x1="0" y1="0" x2="-78" y2="0" stroke-width="2.2"/>
    <line x1="0" y1="0" x2="78" y2="0" stroke-width="2.2"/>
    <!-- Lattice on each sail -->
    <rect x="-3" y="-78" width="14" height="68" fill="none" stroke-width="1"/>
    <rect x="-3" y="10" width="14" height="68" fill="none" stroke-width="1"/>
    <rect x="-78" y="-3" width="68" height="14" fill="none" stroke-width="1"/>
    <rect x="10" y="-3" width="68" height="14" fill="none" stroke-width="1"/>
  </g>
  <!-- Door + window on the base -->
  <rect x="142" y="260" width="14" height="22"/>
  <rect x="148" y="240" width="6" height="8"/>
  <!-- Canal -->
  <path d="M 0 305 Q 100 300 200 305 T 400 305 T 600 305 T 800 305" stroke-width="1.5" opacity="0.6"/>
  <path d="M 0 322 Q 120 318 240 322 T 480 322 T 720 322 T 800 322" stroke-width="1.4" opacity="0.45"/>
  <!-- Bridge -->
  <path d="M 380 295 Q 415 270 450 295" stroke-width="2"/>
  <line x1="380" y1="295" x2="380" y2="305" stroke-width="2"/>
  <line x1="450" y1="295" x2="450" y2="305" stroke-width="2"/>
  <!-- Tulip in foreground (right) -->
  <line x1="640" y1="285" x2="640" y2="245" stroke="#6e7d3a" stroke-width="2.4"/>
  <path d="M 632 245 Q 632 232 640 228 Q 648 232 648 245 Z" fill="#b4513a" stroke="#b4513a" stroke-width="1.8" opacity="0.6"/>
  <path d="M 632 245 Q 636 238 640 238 Q 644 238 648 245" stroke-width="1.2" fill="none"/>
  <!-- Leaf -->
  <path d="M 640 268 Q 628 262 622 270" stroke="#6e7d3a" stroke-width="2" fill="none"/>
  <!-- Bicycle silhouette -->
  <g transform="translate(280 268)" stroke="#1f1812" fill="none">
    <circle cx="0" cy="14" r="8" stroke-width="1.4"/>
    <circle cx="32" cy="14" r="8" stroke-width="1.4"/>
    <path d="M 0 14 L 14 -4 L 28 -4 M 14 -4 L 22 14 L 32 14 M 22 14 L 14 -4" stroke-width="1.4"/>
    <line x1="28" y1="-4" x2="28" y2="-12" stroke-width="1.4"/>
  </g>

</g>
</svg>