<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Atomium, Brussels" class="country-cover-svg">
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f1812" stroke-width="0.6" opacity="0.18"/>
  </pattern>
</defs>
<g fill="none" stroke="#b4513a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

  <line x1="0" y1="285" x2="800" y2="285" opacity="0.4"/>
  <!-- Sun -->
  <circle cx="170" cy="100" r="26" stroke="#b4513a" stroke-width="1.5" opacity="0.7"/>
  <!-- Atomium — 9 spheres connected (cube on a corner) -->
  <g transform="translate(400 175)">
    <!-- Connections (lines first, so they go under spheres) -->
    <line x1="0" y1="-110" x2="-70" y2="-50" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="0" y1="-110" x2="70" y2="-50" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="0" y1="-110" x2="0" y2="0" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="-70" y1="-50" x2="-70" y2="50" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="70" y1="-50" x2="70" y2="50" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="-70" y1="-50" x2="0" y2="0" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="70" y1="-50" x2="0" y2="0" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="-70" y1="50" x2="0" y2="0" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="70" y1="50" x2="0" y2="0" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="-70" y1="50" x2="0" y2="100" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="70" y1="50" x2="0" y2="100" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#1f1812" stroke-width="3" opacity="0.85"/>
    <!-- Spheres -->
    <circle cx="0" cy="-110" r="18" fill="#b4513a" stroke="#1f1812" stroke-width="1.8" opacity="0.55"/>
    <circle cx="-70" cy="-50" r="18" fill="#b4513a" stroke="#1f1812" stroke-width="1.8" opacity="0.55"/>
    <circle cx="70" cy="-50" r="18" fill="#b4513a" stroke="#1f1812" stroke-width="1.8" opacity="0.55"/>
    <circle cx="0" cy="0" r="20" fill="#b4513a" stroke="#1f1812" stroke-width="1.8" opacity="0.7"/>
    <circle cx="-70" cy="50" r="18" fill="#b4513a" stroke="#1f1812" stroke-width="1.8" opacity="0.55"/>
    <circle cx="70" cy="50" r="18" fill="#b4513a" stroke="#1f1812" stroke-width="1.8" opacity="0.55"/>
    <circle cx="0" cy="100" r="18" fill="#b4513a" stroke="#1f1812" stroke-width="1.8" opacity="0.55"/>
  </g>
  <!-- Base support -->
  <path d="M 388 280 L 412 280 L 400 280 L 395 290 L 405 290 Z" stroke="#1f1812" stroke-width="2" fill="#1f1812"/>
  <!-- Brick rooftops silhouette -->
  <path d="M 60 285 L 60 245 L 80 220 L 100 245 L 100 285 Z" stroke-width="1.6" opacity="0.7"/>
  <path d="M 110 285 L 110 240 L 130 218 L 150 240 L 150 285 Z" stroke-width="1.6" opacity="0.7"/>
  <path d="M 660 285 L 660 250 L 680 228 L 700 250 L 700 285 Z" stroke-width="1.6" opacity="0.7"/>
  <path d="M 710 285 L 710 240 L 730 218 L 750 240 L 750 285 Z" stroke-width="1.6" opacity="0.7"/>
  <!-- Frites cone (right foreground) -->
  <g transform="translate(700 305)">
    <path d="M -18 0 L 18 0 L 8 35 L -8 35 Z" fill="#b4513a" stroke="#1f1812" stroke-width="2" opacity="0.5"/>
    <!-- Frites sticking out -->
    <line x1="-10" y1="0" x2="-12" y2="-22" stroke="#1f1812" stroke-width="2.2"/>
    <line x1="-3" y1="0" x2="-5" y2="-28" stroke="#1f1812" stroke-width="2.2"/>
    <line x1="4" y1="0" x2="6" y2="-26" stroke="#1f1812" stroke-width="2.2"/>
    <line x1="10" y1="0" x2="13" y2="-20" stroke="#1f1812" stroke-width="2.2"/>
  </g>

</g>
</svg>