<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Maldives atolls" class="country-cover-svg">
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f1812" stroke-width="0.6" opacity="0.18"/>
  </pattern>
</defs>
<g fill="none" stroke="#b4513a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

  <!-- Horizon -->
  <line x1="0" y1="200" x2="800" y2="200" opacity="0.4"/>
  <!-- Sun -->
  <circle cx="200" cy="130" r="34" stroke="#b4513a" stroke-width="1.6" opacity="0.75"/>
  <circle cx="200" cy="130" r="34" fill="#b4513a" stroke="none" opacity="0.12"/>
  <!-- Distant clouds -->
  <path d="M 380 110 Q 400 100 420 110 Q 440 100 460 110 Q 450 120 420 120 Q 390 122 380 110 Z" stroke-width="1.2" opacity="0.5"/>
  <path d="M 560 145 Q 580 138 600 145 Q 595 152 580 152 Q 565 152 560 145 Z" stroke-width="1.2" opacity="0.4"/>
  <!-- Palm tree (left) — curved trunk -->
  <path d="M 130 290 Q 138 220 155 150" stroke-width="3.5"/>
  <!-- Palm fronds -->
  <path d="M 155 150 Q 130 132 105 138"/>
  <path d="M 155 150 Q 130 148 100 158"/>
  <path d="M 155 150 Q 140 130 130 110"/>
  <path d="M 155 150 Q 175 130 195 125"/>
  <path d="M 155 150 Q 180 145 205 152"/>
  <path d="M 155 150 Q 175 158 200 170"/>
  <!-- Second palm (smaller, right) -->
  <path d="M 645 290 Q 650 240 660 200" stroke-width="2.4"/>
  <path d="M 660 200 Q 640 188 625 192"/>
  <path d="M 660 200 Q 645 196 630 205"/>
  <path d="M 660 200 Q 658 185 650 175"/>
  <path d="M 660 200 Q 678 188 695 192"/>
  <path d="M 660 200 Q 683 196 700 205"/>
  <!-- Overwater bungalow -->
  <!-- Stilts -->
  <line x1="305" y1="290" x2="305" y2="240"/>
  <line x1="345" y1="290" x2="345" y2="240"/>
  <line x1="455" y1="290" x2="455" y2="240"/>
  <line x1="495" y1="290" x2="495" y2="240"/>
  <!-- Floor -->
  <rect x="295" y="232" width="220" height="10" stroke-width="2"/>
  <!-- Walls -->
  <rect x="320" y="200" width="170" height="32" stroke-width="2"/>
  <!-- Triangular roof -->
  <path d="M 305 200 L 405 165 L 505 200 Z" fill="#b4513a" stroke="#b4513a" stroke-width="2.2" opacity="0.18"/>
  <path d="M 305 200 L 405 165 L 505 200" stroke-width="2.2" fill="none"/>
  <!-- Door -->
  <rect x="395" y="208" width="20" height="24"/>
  <!-- Sea — many wavy lines -->
  <path d="M 0 250 Q 80 247 160 250 T 320 250 T 480 250 T 640 250 T 800 250" stroke-width="1.4" opacity="0.55"/>
  <path d="M 0 270 Q 100 266 200 270 T 400 270 T 600 270 T 800 270" stroke-width="1.4" opacity="0.45"/>
  <path d="M 0 290 Q 120 286 240 290 T 480 290 T 720 290 T 800 290" stroke-width="1.4" opacity="0.35"/>
  <path d="M 0 310 Q 100 306 200 310 T 400 310 T 600 310 T 800 310" stroke-width="1.4" opacity="0.3"/>

</g>
</svg>