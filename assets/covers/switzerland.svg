<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Matterhorn, Switzerland" class="country-cover-svg">
<defs>
  <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#1f1812" stroke-width="0.6" opacity="0.18"/>
  </pattern>
</defs>
<g fill="none" stroke="#b4513a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

  <line x1="0" y1="290" x2="800" y2="290" opacity="0.4"/>
  <!-- Sun -->
  <circle cx="650" cy="95" r="30" stroke="#b4513a" stroke-width="1.6" opacity="0.7"/>
  <circle cx="650" cy="95" r="30" fill="#b4513a" stroke="none" opacity="0.12"/>
  <!-- Background lesser mountain -->
  <path d="M 0 290 L 0 245 L 80 175 L 160 200 L 240 165 L 320 195 L 360 290 Z" fill="url(#hatch)" stroke="#1f1812" stroke-width="1.2" opacity="0.55"/>
  <!-- Snow caps on background -->
  <path d="M 65 185 L 80 175 L 95 188" stroke="#1f1812" stroke-width="1.2" fill="none"/>
  <path d="M 225 175 L 240 165 L 255 178" stroke="#1f1812" stroke-width="1.2" fill="none"/>
  <!-- Matterhorn — sharp asymmetric pyramid -->
  <path d="M 280 290 L 360 200 L 420 60 L 460 100 L 530 220 L 580 290 Z" fill="url(#hatch)" stroke="#1f1812" stroke-width="2"/>
  <path d="M 280 290 L 420 60 L 580 290" stroke="#b4513a" stroke-width="2.6" fill="none"/>
  <!-- Snow cap on Matterhorn -->
  <path d="M 380 130 L 420 60 L 450 105 L 432 110 L 415 100 L 400 115 Z" fill="#1f1812" stroke="#1f1812" stroke-width="1.2" opacity="0.18"/>
  <path d="M 380 130 L 420 60 L 450 105" stroke="#1f1812" stroke-width="1.4" fill="none"/>
  <!-- Cable car line -->
  <line x1="60" y1="220" x2="580" y2="155" stroke="#1f1812" stroke-width="0.8" opacity="0.7"/>
  <!-- Two cable cars -->
  <g transform="translate(245 196)">
    <rect x="-9" y="0" width="18" height="10" stroke="#1f1812" stroke-width="1.4" fill="#b4513a" opacity="0.85"/>
    <line x1="0" y1="0" x2="0" y2="-4" stroke="#1f1812" stroke-width="1.2"/>
    <circle cx="0" cy="-5" r="1.6" fill="#1f1812"/>
  </g>
  <g transform="translate(420 175)">
    <rect x="-9" y="0" width="18" height="10" stroke="#1f1812" stroke-width="1.4" fill="#b4513a" opacity="0.85"/>
    <line x1="0" y1="0" x2="0" y2="-4" stroke="#1f1812" stroke-width="1.2"/>
    <circle cx="0" cy="-5" r="1.6" fill="#1f1812"/>
  </g>
  <!-- Cable poles -->
  <line x1="60" y1="220" x2="60" y2="290" stroke="#1f1812" stroke-width="1.4"/>
  <line x1="580" y1="155" x2="580" y2="290" stroke="#1f1812" stroke-width="1.2"/>
  <!-- Chalet on right -->
  <g transform="translate(680 260)">
    <!-- Walls -->
    <rect x="-26" y="-20" width="52" height="30" stroke="#1f1812" stroke-width="1.6"/>
    <!-- Roof -->
    <path d="M -34 -20 L 0 -42 L 34 -20 Z" fill="#b4513a" stroke="#1f1812" stroke-width="1.8" opacity="0.6"/>
    <!-- Door -->
    <rect x="-6" y="-5" width="12" height="15" stroke="#1f1812" stroke-width="1.2"/>
    <!-- Windows -->
    <rect x="-22" y="-15" width="8" height="7" stroke="#1f1812" stroke-width="1"/>
    <rect x="14" y="-15" width="8" height="7" stroke="#1f1812" stroke-width="1"/>
    <!-- Chimney -->
    <rect x="14" y="-38" width="6" height="10" stroke="#1f1812" stroke-width="1.2"/>
    <!-- Smoke wisp -->
    <path d="M 17 -38 Q 20 -45 17 -50 Q 14 -55 17 -60" stroke="#1f1812" stroke-width="1" fill="none" opacity="0.7"/>
  </g>
  <!-- A few pine trees foreground -->
  <g transform="translate(155 285)">
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#1f1812" stroke-width="2"/>
    <path d="M -12 -8 L 0 -28 L 12 -8 Z" fill="#1f1812" stroke="#1f1812" stroke-width="1.4" opacity="0.7"/>
  </g>
  <g transform="translate(620 285)">
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#1f1812" stroke-width="1.6"/>
    <path d="M -10 -7 L 0 -24 L 10 -7 Z" fill="#1f1812" stroke="#1f1812" stroke-width="1.2" opacity="0.7"/>
  </g>

</g>
</svg>