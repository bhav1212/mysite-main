<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a10"/>
      <stop offset="100%" stop-color="#15121a"/>
    </linearGradient>

    <radialGradient id="orbA" cx="0.15" cy="0.18" r="0.5">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#d97757" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbB" cx="0.92" cy="0.95" r="0.55">
      <stop offset="0%" stop-color="#9a6cff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#9a6cff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#9a6cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="warmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8e5e"/>
      <stop offset="55%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#d97757"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff6b35" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </linearGradient>

    <filter id="markGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#orbA)"/>
  <rect width="1200" height="630" fill="url(#orbB)"/>

  <!-- Subtle dot grid -->
  <g fill="#f5f5f0" fill-opacity="0.04">
    <circle cx="80"   cy="80"  r="1.2"/>
    <circle cx="200"  cy="80"  r="1.2"/>
    <circle cx="320"  cy="80"  r="1.2"/>
    <circle cx="440"  cy="80"  r="1.2"/>
    <circle cx="560"  cy="80"  r="1.2"/>
    <circle cx="680"  cy="80"  r="1.2"/>
    <circle cx="800"  cy="80"  r="1.2"/>
    <circle cx="920"  cy="80"  r="1.2"/>
    <circle cx="1040" cy="80"  r="1.2"/>
    <circle cx="1120" cy="80"  r="1.2"/>
    <circle cx="80"   cy="200" r="1.2"/>
    <circle cx="200"  cy="200" r="1.2"/>
    <circle cx="320"  cy="200" r="1.2"/>
    <circle cx="440"  cy="200" r="1.2"/>
    <circle cx="560"  cy="200" r="1.2"/>
    <circle cx="680"  cy="200" r="1.2"/>
    <circle cx="800"  cy="200" r="1.2"/>
    <circle cx="920"  cy="200" r="1.2"/>
    <circle cx="1040" cy="200" r="1.2"/>
    <circle cx="1120" cy="200" r="1.2"/>
    <circle cx="80"   cy="550" r="1.2"/>
    <circle cx="200"  cy="550" r="1.2"/>
    <circle cx="320"  cy="550" r="1.2"/>
    <circle cx="440"  cy="550" r="1.2"/>
    <circle cx="560"  cy="550" r="1.2"/>
    <circle cx="680"  cy="550" r="1.2"/>
    <circle cx="800"  cy="550" r="1.2"/>
    <circle cx="920"  cy="550" r="1.2"/>
    <circle cx="1040" cy="550" r="1.2"/>
    <circle cx="1120" cy="550" r="1.2"/>
  </g>

  <!-- Inner border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="22" ry="22"
        fill="none" stroke="#f5f5f0" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top-left: logo mark + name -->
  <g transform="translate(96, 96)">
    <rect width="64" height="64" rx="14" ry="14" fill="url(#warmGrad)" filter="url(#markGlow)"/>
    <text x="32" y="42" font-family="Georgia, 'Times New Roman', serif"
          font-size="32" font-weight="700" fill="#ffffff"
          text-anchor="middle">B</text>
    <text x="84" y="42" font-family="'Helvetica Neue', Arial, sans-serif"
          font-size="26" font-weight="600" fill="#f5f5f0"
          letter-spacing="-0.5">Bhavesh Jain</text>
  </g>

  <!-- Mono eyebrow -->
  <text x="96" y="248" font-family="'Monaco', 'Courier New', monospace"
        font-size="20" font-weight="500" fill="#ff6b35"
        letter-spacing="3">DATA SCIENTIST · FRAUNHOFER ISI</text>

  <!-- Headline -->
  <text x="96" y="332" font-family="Georgia, 'Times New Roman', serif"
        font-size="68" font-weight="400" fill="#f5f5f0"
        letter-spacing="-2">I build <tspan fill="url(#warmGrad)" font-style="italic">production</tspan></text>
  <text x="96" y="416" font-family="Georgia, 'Times New Roman', serif"
        font-size="68" font-weight="400" fill="#f5f5f0"
        letter-spacing="-2">AI in research and industry.</text>

  <!-- Sub-tagline -->
  <text x="96" y="470" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="400" fill="#f5f5f0" fill-opacity="0.7">
    LLM evaluation · RAG · forecasting · strategic foresight
  </text>

  <!-- Accent rule -->
  <rect x="96" y="498" width="320" height="2" rx="1" fill="url(#ruleGrad)"/>

  <!-- Footer line: URL + location -->
  <text x="96" y="544" font-family="'Monaco', 'Courier New', monospace"
        font-size="20" font-weight="500" fill="#f5f5f0" fill-opacity="0.85"
        letter-spacing="1">bhaveshjain.com</text>
  <text x="1104" y="544" font-family="'Monaco', 'Courier New', monospace"
        font-size="18" font-weight="400" fill="#f5f5f0" fill-opacity="0.55"
        letter-spacing="2" text-anchor="end">HEILBRONN · DE</text>

  <!-- Decorative side glyph (top-right) -->
  <g transform="translate(1040, 110)" stroke="#ff6b35" stroke-opacity="0.55" fill="none" stroke-width="1.5">
    <circle cx="32" cy="32" r="28"/>
    <circle cx="32" cy="32" r="18" stroke-opacity="0.35"/>
    <circle cx="32" cy="32" r="6" fill="#ff6b35" fill-opacity="0.8" stroke="none"/>
  </g>
</svg>
